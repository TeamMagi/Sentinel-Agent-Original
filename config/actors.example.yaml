# Kopyala: cp config/actors.example.yaml config/actors.yaml
# GERÇEK parola/token buraya YAZILMAZ — .secrets/ altına koy, git-ignore'lu.
actors:
  - name: user_A
    role: user
    auth:
      type: token                       # token | storagestate
      login_url: "http://localhost:3000/rest/user/login"
      credentials: { email: "a@test.local", password: "REDACTED" }
      token_location: { kind: "bearer", from: "json:authentication.token" }
      # Login gövde biçimi: json | form | auto (varsayılan "auto"). "auto" önce JSON dener;
      # yalnızca 415/422 yanıtında aynı isteği bir kez form (x-www-form-urlencoded) olarak
      # tekrarlar. FastAPI/Django REST/Spring Security OAuth2 password akışları form bekler —
      # bu yüzden çoğu hedefte elle ayar gerekmez. 401/403'te form denenmez (kilitlenme riski).
      body_format: "auto"
      # Yalnızca form modunda gövdeye eklenir (ör. OAuth2 grant_type/scope). JSON modunda yok sayılır.
      # extra_form_fields: { grant_type: "password", scope: "read" }
      # Sepet id'si login yanıtındaki `bid` alanında gelir → DEĞER değil YOL ver; her aktörde aynı.
      own_ids_from: { basket: "json:authentication.bid" }
      # Faz 2 / T4 (--browser-crawl): SPA token'ı localStorage'a şablonla yazılır.
      # {bearer} → BU aktörün Authorization Bearer token'ı, {cookie:ad} → BU aktörün cookie'si.
      # Çözülemeyen yer tutuculu anahtar yazılmaz; aktörler arası değer paylaşımı olmaz.
      # browser_local_storage: { token: "{bearer}", sid: "{cookie:session}" }
      # Faz 2 / T5b (--browser-crawl): localStorage enjeksiyonu yerine GERÇEK form login.
      # Kimlik bilgileri YUKARIDAKİ credentials'dan okunur (email/username + password);
      # parola log'a/rapora/diske ASLA yazılmaz. Verilmezse mevcut cookie/header/LoS kalır.
      # browser_login:
      #   url: "/login"                       # göreli URL start_url originsine çözülür
      #   username_selector: 'input[type="email"]'
      #   password_selector: 'input[type="password"]'
      #   submit_selector: 'button[type="submit"]'
      #   success_url_contains: "/dashboard"  # opsiyonel; verilmezse sayfa yüklenmesini bekler
      #   timeout_ms: 15000                   # opsiyonel
    # own_object_ids artık opsiyonel: kullanıcı id'si JWT'den, sepet login'den, diğerleri crawl'den
    # çıkarılır. Verilirse daima önceliklidir. basketitem=sepete eklenen BasketItem.id (çıkarılamaz).
    own_object_ids: { basketitem: "1" }

  - name: user_B
    role: user
    auth:
      type: storagestate                # elle login → export edilmiş Playwright state
      storagestate_path: "./.secrets/user_B.storagestate.json"
    own_object_ids: { basket: "2", basketitem: "2" }

  # OAuth/OIDC redirect'i veya JS-tabanlı SPA login formu olan hedefler için (storagestate'in
  # "elle login → export" adımını otomatikleştirir). Yalnızca TOTP MFA otomatikleşir — mfa_*
  # alanları yalnızca hedefte MFA VARSA gerekli; yoksa hepsini kaldır.
  # - name: user_C
  #   role: user
  #   auth:
  #     type: browser
  #     login_url: "https://app.example.com/login"
  #     credentials: { email: "c@test.local", password: "REDACTED" }
  #     mfa_code_selector: 'input[name="otp"]'   # yalnızca MFA varsa
  #     mfa_totp_secret: "REDACTED_BASE32_SECRET" # .secrets/'ten okunmalı, ASLA commit edilmez
  #     headless: true
  #   own_object_ids: { basket: "3" }

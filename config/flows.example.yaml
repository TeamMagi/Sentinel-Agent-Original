# Çok-adımlı / durum-bilgili oracle akışları (config/flows.yaml).
#
# Bu aileler GENEL KEŞİFLE tetiklenemez: iş mantığı, second-order SQLi ve 2FA atlatma hedefe özgü
# endpoint, alan adı ve beklenen yön bilgisi gerektirir. Operatör bunları burada tipli olarak verir.
# Kopyala-çalıştır:  cp config/flows.example.yaml config/flows.yaml
# Koş:               ... --flows config/flows.yaml
#
# Tüm bölümler OPSİYONELdir. Yazma yapan aileler (business_logic, second_order_sqli ve
# hesap ele geçirmede reset-token/OTP tekrar-kullanımı) yalnız scope.destructive_tests=True iken
# koşar; kapalıysa atlanır. Aşağıdaki örnekler YETKİLİ bir lab hedefi (OWASP Juice Shop) içindir;
# gerçek değerleri kendi yetkili hedefine göre doldur.

# --- İş mantığı (business logic) ---
business_logic:
  # Negatif/sıfır miktar: satın alma bakiyeyi düşürmeli; negatif değer TERS yönde oynatırsa açık.
  - kind: negative_amount
    endpoint: {method: POST, path_template: "/api/purchase"}
    state_path: "/api/wallet/{id}"      # kaynak bakiyesini okuyan GET ("{id}" = own_object_ids anahtarı)
    state_field: "balance"              # JSON'da izlenen değer (noktalı yol destekli)
    amount_field: "amount"              # negatif gönderilecek alan
    expected_direction: decrease        # meşru satın almada bakiye azalır
    bad_value: -50                      # manipüle değer
    action_body: {product: "9"}         # aksiyon gövdesinin sabit kısmı
    resource_key: wallet                # actor.own_object_ids[wallet] = kaynak id'si
    actor: user_A                       # akışı koşturacak aktör (yoksa ilk oturum)

  # Kupon tekrarı: tek kullanımlık kupon ikinci kez toplamı indirmemeli.
  - kind: coupon_reuse
    endpoint: {method: POST, path_template: "/api/basket/apply-coupon"}
    state_path: "/api/basket/{id}"
    state_field: "total"
    coupon_field: "coupon"
    coupon_code: "WELCOME10"
    action_body: {}
    resource_key: basket
    actor: user_A

  # İş akışı atlama: ödeme adımı yapılmadan sipariş "completed" olmamalı.
  - kind: workflow_bypass
    endpoint: {method: POST, path_template: "/api/order/confirm"}
    state_path: "/api/order/{id}"
    state_field: "status"
    completed_value: "completed"
    action_body: {}
    resource_key: order
    actor: user_A

# --- Second-order (stored) SQLi ---
second_order_sqli:
  # Profil adına yazılan değer, başka bir okuma sorgusunda patlar.
  - write_endpoint: {method: POST, path_template: "/api/profile"}
    read_endpoint: {method: GET, path_template: "/api/profile/{id}"}
    write_param: "name"
    write_fields: {bio: "ornek"}        # gövdenin diğer sabit alanları
    read_id: "1"
    actor: user_A

# --- Hesap ele geçirme ---
account_takeover:
  # 2FA tamamlanmamış oturum korumalı kaynağa erişebiliyor mu?
  - kind: mfa_precondition_bypass
    endpoint: {method: GET, path_template: "/api/me"}
    pre_mfa_actor: user_pre_mfa         # 1. faktör geçmiş, 2FA TAMAMLANMAMIŞ aktör
    anon_actor: anonymous               # negatif kontrol (401/403 beklenir) — opsiyonel
    authed_actor: user_A                # pozitif kontrol (tam yetkili, 2xx) — opsiyonel

  # Şifre sıfırlama token'ı aynı değerle İKİ kez kullanılabiliyor mu? (yazma → destructive)
  # `token`/`bogus_token` SIR'dır: config/flows.yaml git-ignore'da tutulur, depoya commit edilmez.
  - kind: password_reset_reuse
    endpoint: {method: POST, path_template: "/api/reset-confirm"}
    token_field: token                  # gövdedeki token alanı
    token: "REPLACE_WITH_VALID_TOKEN"
    bogus_token: "REPLACE_WITH_BOGUS_TOKEN"   # negatif kontrol — opsiyonel
    body_fields: {newPassword: "NewP@ss1!"}   # gövdenin sabit kısmı
    actor: victim                       # reset akışını yürüten oturum (yoksa ilk oturum)

  # Toplanmış reset token'larında zayıf desen (kısa sayısal/ardışık/timestamp/düşük entropi).
  # Ağ isteği yapmaz; destructive_tests gerektirmez.
  - kind: password_reset_weakness
    tokens: ["1000001", "1000002", "1000003"]
    min_samples: 2

  # Aynı OTP iki kez doğrulanabiliyor mu? (yazma → destructive)
  - kind: otp_replay
    endpoint: {method: POST, path_template: "/api/otp/verify"}
    otp_field: otp                      # gövdedeki OTP alanı
    otp: "445566"                       # SIR — git-ignore config
    bogus_otp: "000000"                 # negatif kontrol — opsiyonel
    body_fields: {}                     # gövdenin sabit kısmı
    actor: victim
